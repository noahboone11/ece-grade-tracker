<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECE Term 5 Grade Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">

        <!-- Top Bar -->
        <header class="header">
            <div class="header-brand">
                <h1>ECE Grade Tracker</h1>
                <p>Computer Engineering &middot; Winter 2026</p>
            </div>
            <div class="user-info" id="user-info" style="display: none;">
                <div class="user-avatar" id="user-avatar"></div>
                <div class="welcome-text" id="welcome-text"></div>
                <button class="data-btn" onclick="exportData()" title="Export your grades as JSON">Export</button>
                <button class="data-btn" onclick="importData()" title="Import grades from a JSON file">Import</button>
                <button class="logout-btn" onclick="logout()">Reset</button>
            </div>
        </header>

        <!-- First-Visit Modal -->
        <div id="login-modal" class="login-modal" style="display: none;">
            <div class="login-form">
                <div class="login-logo">📊</div>
                <h2>Welcome</h2>
                <p class="login-subtitle">Your grades stay in your browser — nothing is sent anywhere.</p>
                <div class="form-group">
                    <label for="display-name">Your Name</label>
                    <input type="text" id="display-name" placeholder="e.g. Alex Smith" required autocomplete="name">
                </div>
                <button class="login-btn" onclick="setupUser()">Get Started</button>
                <p class="login-import-hint">
                    Returning with a backup? <button class="link-btn" onclick="importData()">Import your data</button>
                </p>
            </div>
        </div>

        <!-- Hidden track selector -->
        <div class="track-selector" id="track-selector" style="display: none;"></div>

        <!-- Dashboard -->
        <div id="dashboard" class="dashboard">

            <div class="stats-overview">
                <div class="stat-card stat-card--hero">
                    <p class="stat-label">Overall GPA</p>
                    <h3 id="gpa-display">--</h3>
                </div>
                <div class="stat-card">
                    <p class="stat-label">Average Grade</p>
                    <h3 id="avg-display">--%</h3>
                </div>
                <div class="stat-card">
                    <p class="stat-label">Passing</p>
                    <h3 id="passing-display">-/-</h3>
                </div>
            </div>

            <!-- Upcoming Assessments -->
            <div class="upcoming-assessments" id="upcoming-container">
                <div class="upcoming-header" onclick="toggleUpcomingAssessments()">
                    <div class="upcoming-header-content">
                        <h2>Upcoming Assessments</h2>
                        <div class="upcoming-summary">
                            <span class="upcoming-count">Loading...</span>
                        </div>
                    </div>
                    <span class="expand-indicator">▲</span>
                </div>
                <div class="upcoming-content">
                    <div id="upcoming-assessments"></div>
                </div>
            </div>

            <div class="courses-grid" id="courses-grid"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-content">
            <p>Made by <span class="creator-name">Noah Boone</span></p>
            <p class="footer-subtitle">MUN ECE Term 5 &middot; Computer Engineering</p>
        </div>
    </footer>

    <script src="js/courses.js"></script>
    <script src="js/grading.js"></script>
    <script src="js/upcoming-assessments.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
