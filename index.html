<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECE Term 5 Grade Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">

        <!-- Top Bar -->
        <header class="header">
            <div class="header-brand">
                <h1>ECE Grade Tracker</h1>
                <p>Computer Engineering &middot; Winter 2026</p>
            </div>
            <div class="user-info" id="user-info" style="display: none;">
                <div class="user-avatar" id="user-avatar"></div>
                <div class="welcome-text" id="welcome-text"></div>
                <button class="logout-btn" onclick="logout()">Sign out</button>
            </div>
        </header>

        <!-- Login Modal -->
        <div id="login-modal" class="login-modal">
            <div class="login-form">
                <div class="login-logo">📊</div>
                <h2>Welcome back</h2>
                <p class="login-subtitle">Sign in to your grade tracker</p>

                <div id="login-section">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Enter your username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                    <button class="login-btn" onclick="login()">Sign In</button>
                    <button class="register-btn" onclick="showRegister()">Create Account</button>
                </div>

                <div id="register-section" style="display: none;">
                    <div class="form-group">
                        <label for="reg-username">Username</label>
                        <input type="text" id="reg-username" placeholder="Choose a username" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" placeholder="Choose a password" required>
                    </div>
                    <div class="form-group">
                        <label for="full-name">Full Name</label>
                        <input type="text" id="full-name" placeholder="Enter your full name" required>
                    </div>
                    <button class="login-btn" onclick="register()">Create Account</button>
                    <button class="register-btn" onclick="showLogin()">Back to Sign In</button>
                </div>
            </div>
        </div>

        <!-- Hidden track selector -->
        <div class="track-selector" id="track-selector" style="display: none;"></div>

        <!-- Dashboard -->
        <div id="dashboard" class="dashboard">

            <div class="stats-overview">
                <div class="stat-card stat-card--hero">
                    <p class="stat-label">Overall GPA</p>
                    <h3 id="gpa-display">--</h3>
                </div>
                <div class="stat-card">
                    <p class="stat-label">Average Grade</p>
                    <h3 id="avg-display">--%</h3>
                </div>
                <div class="stat-card">
                    <p class="stat-label">Passing</p>
                    <h3 id="passing-display">-/-</h3>
                </div>
            </div>

            <!-- Upcoming Assessments -->
            <div class="upcoming-assessments" id="upcoming-container">
                <div class="upcoming-header" onclick="toggleUpcomingAssessments()">
                    <div class="upcoming-header-content">
                        <h2>Upcoming Assessments</h2>
                        <div class="upcoming-summary">
                            <span class="upcoming-count">Loading...</span>
                        </div>
                    </div>
                    <span class="expand-indicator">▲</span>
                </div>
                <div class="upcoming-content">
                    <div id="upcoming-assessments"></div>
                </div>
            </div>

            <div class="courses-grid" id="courses-grid"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-content">
            <p>Made with ❤️ by <span class="creator-name">Noah Boone</span></p>
            <p class="footer-subtitle">MUN ECE Term 5 &middot; Computer Engineering</p>
        </div>
    </footer>

    <script src="js/courses.js"></script>
    <script src="js/grading.js"></script>
    <script src="js/upcoming-assessments.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
